# ----- Ejecución -----

exec_always waybar

exec_always swaybg -i $HOME/images/wallpapers/rain-world.jpg -m fill

exec_always wl-paste --type text --watch cliphist store
exec_always wl-paste --type image --watch cliphist store

# Bloqueo y suspensión por inactividad
exec_always swayidle -w timeout 900 'swaylock -f' timeout 1200 'systemctl suspend'
